<text x="40" y="112" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue','Leelawadee UI','Noto Sans Thai',Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" text-anchor="start" letter-spacing="-.5">VisMedS</text>
<text x="40" y="146" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue','Leelawadee UI','Noto Sans Thai',Arial,sans-serif" font-size="14" font-weight="400" fill="#A09DB3" text-anchor="start" >Snap a photo of a medicine, get the facts.</text>
<text x="40" y="167" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue','Leelawadee UI','Noto Sans Thai',Arial,sans-serif" font-size="14" font-weight="400" fill="#A09DB3" text-anchor="start" >A label search site, an image classifier and</text>
<text x="40" y="188" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue','Leelawadee UI','Noto Sans Thai',Arial,sans-serif" font-size="14" font-weight="400" fill="#A09DB3" text-anchor="start" >a LINE bot that only answers from a checked</text>
